name: Update README

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight
  push:
    branches:
      - main

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Calculate Total Commits
        id: commits
        run: |
          echo "TOTAL_COMMITS=$(git rev-list --count HEAD)" >> $GITHUB_ENV

      - name: Update README
        run: |
          sed -i "s/Total Commits: [0-9]*/Total Commits: ${{ env.TOTAL_COMMITS }}/" README.md

      - name: Commit Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m "Update total commits in README"
          git push
